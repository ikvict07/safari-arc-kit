<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: rgba(28, 28, 31, 0.97);
    --fg: #f2f2f2;
    --muted: #8e8e93;
    --sel: rgba(255, 255, 255, 0.12);
    --hover: rgba(255, 255, 255, 0.06);
    --accent: #6c8cff;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: rgba(246, 246, 248, 0.98); --fg: #1c1c1e; --muted: #6e6e73; --sel: rgba(0,0,0,0.09); --hover: rgba(0,0,0,0.04); }
  }
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font: 13.5px -apple-system, "SF Pro Text", Helvetica, sans-serif; color: var(--fg); -webkit-user-select: none; }
  #panel { position: absolute; inset: 0; background: var(--bg); border-right: 1px solid rgba(255,255,255,0.08); box-shadow: 8px 0 24px rgba(0,0,0,0.25); display: flex; flex-direction: column; }
  #head { padding: 14px 16px 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; display: flex; justify-content: space-between; }
  #favs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 4px 12px 10px; }
  #favs:empty { padding: 0; }
  .fav { height: 44px; border-radius: 10px; background: var(--hover); display: flex; align-items: center; justify-content: center; cursor: default; }
  .fav:hover { background: var(--sel); }
  .fav img { width: 22px; height: 22px; border-radius: 5px; }
  .fav.open { box-shadow: inset 0 0 0 1.5px var(--accent); }
  #list { flex: 1; overflow-y: auto; padding: 0 8px 8px; border-top: 1px solid rgba(128,128,128,0.18); padding-top: 6px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: default; }
  .row:hover { background: var(--hover); }
  .row.active { background: var(--sel); }
  .icon { width: 16px; height: 16px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .icon img { width: 16px; height: 16px; border-radius: 3px; }
  .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .close { width: 18px; height: 18px; border-radius: 5px; display: none; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; flex: none; }
  .row:hover .close { display: flex; }
  .close:hover { background: rgba(255,255,255,0.15); color: var(--fg); }
  #foot { padding: 6px 8px 12px; border-top: 1px solid rgba(128,128,128,0.18); }
  #foot .row { color: var(--muted); }
</style>
</head>
<body>
<div id="panel">
  <div id="head"><span id="profile"></span><span id="count"></span></div>
  <div id="favs"></div>
  <div id="list"></div>
  <div id="foot"><div class="row" id="newtab"><span class="icon">＋</span><span class="title">New tab</span></div></div>
</div>
<script>
  const list = document.getElementById('list');
  function send(msg) { window.webkit.messageHandlers.sidebar.postMessage(msg); }
  function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function render(data) {
    document.getElementById('profile').textContent = data.profile || 'Safari';
    document.getElementById('favs').innerHTML = (data.favorites || []).map(f =>
      '<div class="fav' + (f.open ? ' open' : '') + '" data-url="' + esc(f.url) + '" title="' + esc(f.title) + '">' +
        '<img src="' + esc(f.icon) + '" onerror="this.replaceWith(document.createTextNode(\'' + esc((f.title || '?')[0]) + '\'))"></div>').join('');
    document.getElementById('count').textContent = (data.tabs || []).length + ' tabs';
    list.innerHTML = (data.tabs || []).map(t =>
      '<div class="row' + (t.active ? ' active' : '') + '" data-i="' + t.index + '">' +
        '<span class="icon">' + (t.icon ? '<img src="' + esc(t.icon) + '" onerror="this.replaceWith(document.createTextNode(\'▣\'))">' : '▣') + '</span>' +
        '<span class="title" title="' + esc(t.url) + '">' + esc(t.title) + '</span>' +
        '<span class="close" data-close="' + t.index + '">×</span>' +
      '</div>').join('');
    const a = list.querySelector('.row.active');
    if (a) a.scrollIntoView({block: 'nearest'});
  }
  list.addEventListener('click', e => {
    const c = e.target.closest('.close');
    if (c) { e.stopPropagation(); send({type: 'close', index: Number(c.dataset.close)}); return; }
    const r = e.target.closest('.row');
    if (r) send({type: 'activate', index: Number(r.dataset.i)});
  });
  document.getElementById('newtab').addEventListener('click', () => send({type: 'newtab'}));
  document.getElementById('favs').addEventListener('click', e => {
    const f = e.target.closest('.fav');
    if (f) send({type: 'favorite', url: f.dataset.url});
  });
  document.body.addEventListener('mouseenter', () => send({type: 'enter'}));
  document.body.addEventListener('mouseleave', () => send({type: 'leave'}));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') send({type: 'leave'}); });
</script>
</body>
</html>
